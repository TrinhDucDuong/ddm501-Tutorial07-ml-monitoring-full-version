name: ddm501-tutorial07
services:
  postgres:
    image: postgres:13
    container_name: tutorial07-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - mlflow
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - monitoring
    restart: unless-stopped
  minio:
    image: ddm501-tutorial07-minio:2025-09-07
    container_name: tutorial07-minio
    command: server /data --console-address ":9001"
    environment:
    - MINIO_ROOT_USER=minio
    - MINIO_ROOT_PASSWORD=minio123
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:${MINIO_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - monitoring
    build: ./minio
    restart: unless-stopped
  minio-init:
    container_name: tutorial07-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
    - python
    - /scripts/init_minio.py
    networks:
    - monitoring
    build: ./api
    volumes:
    - ./scripts:/scripts:ro
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: tutorial07-mlflow
    environment:
    - AWS_ACCESS_KEY_ID=minio
    - AWS_SECRET_ACCESS_KEY=minio123
    - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    - MLFLOW_S3_IGNORE_TLS=true
    volumes:
    - mlflow_data:/mlflow
    ports:
    - 127.0.0.1:${MLFLOW_PORT:-5000}:5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c 'import urllib.request; print(urllib.request.urlopen("http://0.0.0.0:5000/health").getcode())'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - monitoring
    restart: unless-stopped
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tutorial07-api
    ports:
    - 127.0.0.1:${API_PORT:-8000}:8000
    environment:
    - MLFLOW_TRACKING_URI=http://mlflow:5000
    - MODEL_NAME=wine_quality_model
    - MODEL_STAGE=Production
    - AWS_ACCESS_KEY_ID=minio
    - AWS_SECRET_ACCESS_KEY=minio123
    - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    - MLFLOW_S3_IGNORE_TLS=true
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - monitoring
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: tutorial07-prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
    - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    depends_on:
    - api
    networks:
    - monitoring
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.0.1
    container_name: tutorial07-grafana
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    depends_on:
    - prometheus
    networks:
    - monitoring
    restart: unless-stopped
  evidently:
    build:
      context: ./evidently
      dockerfile: Dockerfile
    container_name: tutorial07-evidently
    ports:
    - 127.0.0.1:${EVIDENTLY_PORT:-8001}:8001
    volumes:
    - evidently_data:/app/data
    - evidently_reports:/app/reports
    - evidently_reference:/app/reference
    environment:
    - EVIDENTLY_REFERENCE_WINDOW=7d
    - EVIDENTLY_ANALYSIS_INTERVAL=1h
    - EVIDENTLY_DRIFT_THRESHOLD=0.1
    - EVIDENTLY_MIN_SAMPLES=100
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8001/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
    - monitoring
    restart: unless-stopped
  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    command:
    - --statsd.mapping-config=/etc/statsd_mapping.yml
    volumes:
    - ./config/statsd_mapping.yml:/etc/statsd_mapping.yml:ro
    networks:
    - monitoring
    restart: unless-stopped
  airflow-init:
    build: &id001
      context: ./airflow
      dockerfile: Dockerfile
    image: ddm501-tutorial07-airflow:2.10.5
    user: ${AIRFLOW_UID:-50000}:0
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_PORT:-18070}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-secret-change-me}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__METRICS__STATSD_ON: 'true'
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 9125
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      PYTHONPATH: /opt/airflow/scripts
      API_URL: http://api:8000
      MLFLOW_URL: http://mlflow:5000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_PUBLIC_URL: http://localhost:${MLFLOW_PORT:-5000}
      EVIDENTLY_URL: http://evidently:8001
      EVIDENTLY_PUBLIC_URL: http://localhost:${EVIDENTLY_PORT:-8001}
      EVIDENTLY_DRIFT_THRESHOLD: ${EVIDENTLY_DRIFT_THRESHOLD:-0.1}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_IGNORE_TLS: 'true'
      MODEL_NAME: wine_quality_model
      RETRAIN_MIN_ACCURACY: ${RETRAIN_MIN_ACCURACY:-0.8}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      POSTGRES_HOST: postgres
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
      AIRFLOW_DB_NAME: airflow
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__CORE__PARALLELISM: '4'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    volumes: &id002
    - ./airflow_dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts:ro
    - airflow_logs:/opt/airflow/logs
    networks: &id003
    - monitoring
    container_name: tutorial07-airflow-init
    entrypoint: /bin/bash
    command: /opt/airflow/init_airflow.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  airflow-webserver:
    build: *id001
    image: ddm501-tutorial07-airflow:2.10.5
    user: ${AIRFLOW_UID:-50000}:0
    environment: &id004
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_PORT:-18070}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-secret-change-me}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__METRICS__STATSD_ON: 'true'
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 9125
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      PYTHONPATH: /opt/airflow/scripts
      API_URL: http://api:8000
      MLFLOW_URL: http://mlflow:5000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_PUBLIC_URL: http://localhost:${MLFLOW_PORT:-5000}
      EVIDENTLY_URL: http://evidently:8001
      EVIDENTLY_PUBLIC_URL: http://localhost:${EVIDENTLY_PORT:-8001}
      EVIDENTLY_DRIFT_THRESHOLD: ${EVIDENTLY_DRIFT_THRESHOLD:-0.1}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_IGNORE_TLS: 'true'
      MODEL_NAME: wine_quality_model
      RETRAIN_MIN_ACCURACY: ${RETRAIN_MIN_ACCURACY:-0.8}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__CORE__PARALLELISM: '4'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    volumes: *id002
    networks: *id003
    container_name: tutorial07-airflow-webserver
    command: webserver
    ports:
    - 127.0.0.1:${AIRFLOW_PORT:-18070}:8080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      statsd-exporter:
        condition: service_started
    restart: unless-stopped
  airflow-scheduler:
    build: *id001
    image: ddm501-tutorial07-airflow:2.10.5
    user: ${AIRFLOW_UID:-50000}:0
    environment: *id004
    volumes: *id002
    networks: *id003
    container_name: tutorial07-airflow-scheduler
    command: scheduler
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8974/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      statsd-exporter:
        condition: service_started
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: tutorial07-alertmanager
    entrypoint:
    - /bin/sh
    - -c
    command:
    - sed "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/" /etc/alertmanager/alertmanager.yml.tmpl
      > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
      --storage.path=/alertmanager
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
    - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
    - ./secrets/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
    - alertmanager_data:/alertmanager
    ports:
    - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    networks:
    - monitoring
    restart: unless-stopped
  trainer:
    build: ./api
    profiles:
    - tools
    command:
    - python
    - /scripts/training.py
    volumes:
    - ./scripts:/scripts:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
    - monitoring
volumes:
  postgres_data:
    driver: local
    name: ${USER}_monitoring-postgres_data
  minio_data:
    driver: local
    name: ${USER}_monitoring-minio_data
  mlflow_data:
    driver: local
    name: ${USER}_monitoring-mlflow_data
  prometheus_data:
    driver: local
    name: ${USER}_monitoring-prometheus_data
  grafana_data:
    driver: local
    name: ${USER}_monitoring-grafana_data
  evidently_data:
    driver: local
    name: ${USER}_monitoring-evidently_data
  evidently_reports:
    driver: local
    name: ${USER}_monitoring-evidently_reports
  evidently_reference:
    driver: local
    name: ${USER}_monitoring-evidently_reference
  airflow_logs: null
  alertmanager_data: {}
networks:
  monitoring:
    driver: bridge
